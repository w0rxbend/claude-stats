name: Release

# Publishing is driven entirely by the tag. Pushing `v0.2.0` builds every
# target, attaches the archives to a GitHub release, and that release is what
# install.sh downloads -- so cutting a version is one `git tag && git push`
# and nothing else.
on:
  push:
    tags: ["v*"]
  # Lets the whole matrix be exercised on a branch before a tag is cut, which
  # is the only way to find a broken cross-compile without publishing a broken
  # release first.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Refuse early if the tag and Cargo.toml disagree. Catching it here costs
  # seconds; catching it after publication means a release whose `--version`
  # lies about which release it is.
  verify-version:
    name: verify the tag matches Cargo.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Compare the tag with the crate version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tagged="${GITHUB_REF_NAME#v}"
          declared="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "$tagged" != "$declared" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $declared"
            exit 1
          fi
          echo "releasing $declared"

  build:
    name: ${{ matrix.target }}
    needs: verify-version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds target musl and link statically. A glibc binary is
          # bound to the glibc of whatever built it, so one built on the
          # current Ubuntu runner refuses to start on any older distribution.
          # A static musl binary runs on all of them, and the crate has no C
          # dependencies, so nothing is given up for it.
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm

          # macOS runners are Apple silicon, and the Xcode toolchain they ship
          # can produce Intel binaries, so both Mac targets build natively on
          # one runner -- no cross toolchain, no emulation.
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-apple-darwin
            runner: macos-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install the Rust toolchain for ${{ matrix.target }}
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Check that the binary runs
        # Only meaningful where the runner can execute what was just built.
        # `models` is a pure lookup with no filesystem or terminal
        # requirements, which makes it the one subcommand that is safe to run
        # on a headless runner.
        if: matrix.target != 'x86_64-apple-darwin'
        run: |
          ./target/${{ matrix.target }}/release/claude-stats --version
          ./target/${{ matrix.target }}/release/claude-stats models

      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          name="claude-stats-${version}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/claude-stats" "dist/$name/"
          cp README.md LICENSE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          echo "archive=dist/$name.tar.gz" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ steps.package.outputs.archive }}
          retention-days: 7

  publish:
    name: publish the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # One checksum file covering every archive, so `install.sh` can verify a
      # download with a single extra request rather than one per target.
      - name: Write the checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum ./*.tar.gz | sed 's|\./||' > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
