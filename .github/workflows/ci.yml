name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Warnings are failures in CI. The alternative is a warning count that only
  # ever grows, because nobody fixes a warning that does not block anything.
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Install the Rust toolchain
        run: rustup toolchain install stable --component clippy,rustfmt --profile minimal

      - name: Cache the cargo registry and build directory
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --all-targets --all-features

      - name: Test
        run: cargo test --all-features

      - name: Build the release binary
        run: cargo build --release
